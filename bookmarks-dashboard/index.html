<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f7f7f7;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #666;
        }

        .stat-item strong {
            color: #667eea;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        .category-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bookmark-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
        }

        .bookmark-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .bookmark-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .bookmark-url {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            word-break: break-all;
            display: block;
            margin-bottom: 10px;
        }

        .bookmark-url:hover {
            text-decoration: underline;
        }

        .bookmark-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .bookmark-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            background: #f0f0f0;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .bookmark-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #ffa726;
            color: white;
        }

        .btn-edit:hover {
            background: #fb8c00;
        }

        .btn-delete {
            background: #ef5350;
            color: white;
        }

        .btn-delete:hover {
            background: #e53935;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn-secondary {
            background: #ccc;
            color: #333;
        }

        .btn-secondary:hover {
            background: #b3b3b3;
        }

        .empty-state {
            background: white;
            padding: 60px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .bookmarks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .category-filter {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 My Bookmarks</h1>
            <div class="stats">
                <div class="stat-item">Total: <strong id="totalCount">0</strong></div>
                <div class="stat-item">Categories: <strong id="categoryCount">0</strong></div>
            </div>
        </header>

        <div class="controls">
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Bookmark</button>
            <div class="category-filter" id="categoryFilter">
                <button class="category-btn active" data-category="all">All</button>
            </div>
        </div>

        <div class="bookmarks-grid" id="bookmarksGrid">
            <!-- Bookmarks will be rendered here -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="bookmarkModal">
        <div class="modal-content">
            <h2 class="modal-header" id="modalTitle">Add Bookmark</h2>
            <form id="bookmarkForm" onsubmit="saveBookmark(event)">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="url">URL *</label>
                    <input type="url" id="url" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="category">Category *</label>
                    <input type="text" id="category" required placeholder="e.g., Development, Design, News">
                </div>
                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags" placeholder="e.g., javascript, tutorial, reference">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let bookmarks = [];
        let editingId = null;
        let currentFilter = 'all';

        // Load bookmarks from localStorage
        function loadBookmarks() {
            const stored = localStorage.getItem('bookmarks');
            bookmarks = stored ? JSON.parse(stored) : [];
            renderBookmarks();
            updateStats();
            renderCategoryFilter();
        }

        // Save bookmarks to localStorage
        function saveToStorage() {
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
        }

        // Open add modal
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Bookmark';
            document.getElementById('bookmarkForm').reset();
            document.getElementById('bookmarkModal').classList.add('active');
        }

        // Open edit modal
        function openEditModal(id) {
            editingId = id;
            const bookmark = bookmarks.find(b => b.id === id);
            if (!bookmark) return;

            document.getElementById('modalTitle').textContent = 'Edit Bookmark';
            document.getElementById('title').value = bookmark.title;
            document.getElementById('url').value = bookmark.url;
            document.getElementById('description').value = bookmark.description || '';
            document.getElementById('category').value = bookmark.category;
            document.getElementById('tags').value = bookmark.tags ? bookmark.tags.join(', ') : '';
            document.getElementById('bookmarkModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('bookmarkModal').classList.remove('active');
            document.getElementById('bookmarkForm').reset();
            editingId = null;
        }

        // Save bookmark
        function saveBookmark(event) {
            event.preventDefault();

            const title = document.getElementById('title').value.trim();
            const url = document.getElementById('url').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value.trim();
            const tagsInput = document.getElementById('tags').value.trim();
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

            const bookmark = {
                id: editingId || Date.now(),
                title,
                url,
                description,
                category,
                tags,
                createdAt: editingId ? bookmarks.find(b => b.id === editingId).createdAt : new Date().toISOString()
            };

            if (editingId) {
                const index = bookmarks.findIndex(b => b.id === editingId);
                bookmarks[index] = bookmark;
            } else {
                bookmarks.unshift(bookmark);
            }

            saveToStorage();
            renderBookmarks();
            updateStats();
            renderCategoryFilter();
            closeModal();
        }

        // Delete bookmark
        function deleteBookmark(id) {
            if (confirm('Are you sure you want to delete this bookmark?')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                saveToStorage();
                renderBookmarks();
                updateStats();
                renderCategoryFilter();
            }
        }

        // Set category filter
        function setFilter(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            renderBookmarks();
        }

        // Render category filter buttons
        function renderCategoryFilter() {
            const categories = ['all', ...new Set(bookmarks.map(b => b.category))];
            const filterContainer = document.getElementById('categoryFilter');
            
            filterContainer.innerHTML = categories.map(cat => `
                <button class="category-btn ${cat === currentFilter ? 'active' : ''}" 
                        data-category="${cat}"
                        onclick="setFilter('${cat}')">
                    ${cat === 'all' ? 'All' : cat}
                </button>
            `).join('');
        }

        // Render bookmarks
        function renderBookmarks() {
            const grid = document.getElementById('bookmarksGrid');
            const filteredBookmarks = currentFilter === 'all' 
                ? bookmarks 
                : bookmarks.filter(b => b.category === currentFilter);

            if (filteredBookmarks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <h2>No bookmarks yet</h2>
                        <p>Click "Add Bookmark" to get started!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredBookmarks.map(bookmark => `
                <div class="bookmark-card">
                    <div class="bookmark-title">${escapeHtml(bookmark.title)}</div>
                    <a href="${escapeHtml(bookmark.url)}" target="_blank" class="bookmark-url">
                        ${escapeHtml(bookmark.url)}
                    </a>
                    ${bookmark.description ? `<div class="bookmark-description">${escapeHtml(bookmark.description)}</div>` : ''}
                    ${bookmark.tags && bookmark.tags.length > 0 ? `
                        <div class="bookmark-tags">
                            ${bookmark.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="bookmark-actions">
                        <button class="btn-small btn-edit" onclick="openEditModal(${bookmark.id})">Edit</button>
                        <button class="btn-small btn-delete" onclick="deleteBookmark(${bookmark.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalCount').textContent = bookmarks.length;
            const categories = new Set(bookmarks.map(b => b.category));
            document.getElementById('categoryCount').textContent = categories.size;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.getElementById('bookmarkModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        loadBookmarks();
    </script>
</body>
</html>
